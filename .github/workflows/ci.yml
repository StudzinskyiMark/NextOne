name: CI

on:
  push:
    branches: [main, dev, test/integration-vitest-playwrigth]
  pull_request:

env:
  CONVEX_DEPLOYMENT: ${{ secrets.CONVEX_DEPLOYMENT }}
  NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
  NEXT_PUBLIC_CONVEX_SITE_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_SITE_URL }}
  CONVEX_SITE_URL: ${{ secrets.CONVEX_SITE_URL }}
  SITE_URL: ${{ secrets.SITE_URL }}
  BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20 # Фіксуємо версію 20 для стабільності

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Run linter
        run: pnpm lint

      - name: Type check
        run: pnpm tsc --noEmit

      - name: Run Vitest
        run: pnpm vitest --run

      - name: Build project
        run: pnpm build

  playwright-e2e:
    runs-on: ubuntu-latest
    needs: build # 🛡️ Запускати тільки після того, як задача 'build' завершиться успішно!
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20 # Синхронізовано з першою джобою

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: Run Playwright tests
        run: pnpm exec playwright test

      # Зберігаємо звіти тестів, якщо вони впали, щоб розібратися в помилках
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
